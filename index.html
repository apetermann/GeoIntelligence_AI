<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoIntelligence AI — Visualizador</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="styles.css?v=16" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header class="sidebar-header">
        <div class="brand">
          <img src="assets/nexial-logo.png" alt="Nexial Partners" class="brand-nexial" />
        </div>
        <h1>GeoIntelligence <span>AI</span></h1>
        <p class="subtitle">Visualizador de inteligência geológica — empresas listadas de mineração e piloto Caladão / GME</p>
        <button type="button" id="reportBtn" class="report-btn">📄 Relatório geológico (PDF)</button>
      </header>

      <div class="controls">
        <input type="search" id="search" placeholder="Buscar empresa, projeto ou ticker…" autocomplete="off" />

        <div class="layer-group">
          <label class="layer-toggle">
            <input type="checkbox" id="companiesToggle" checked />
            <b>Empresas</b>&nbsp;(<span id="companiesCount">…</span>)
          </label>
          <select id="exchangeFilter" aria-label="Filtrar por bolsa"><option value="">Todas as bolsas</option></select>
          <div class="filter-row">
            <select id="commodityFilter" aria-label="Filtrar por commodity"><option value="">Todas as commodities</option></select>
            <select id="stateFilter" aria-label="Filtrar por estado"><option value="">Todos os estados</option></select>
          </div>
        </div>

        <div class="layer-group">
          <label class="layer-toggle">
            <b>Piloto Caladão / GME</b>
            <button type="button" id="pilotFocus" title="Focar no piloto e ligar as camadas">focar</button>
          </label>
          <p class="pilot-info">832.781/2023 · Catují/MG · lítio (ANM)</p>
          <div class="pilot-layers">
            <label class="layer-toggle sub"><input type="checkbox" id="tglGeologia" /> Geologia 1:250k</label>
            <label class="layer-toggle sub"><input type="checkbox" id="tglVizinhos" /> Vizinhos + Axel</label>
            <label class="layer-toggle sub"><input type="checkbox" id="tglEstruturas" /> Falhas/fraturas</label>
            <label class="layer-toggle sub"><input type="checkbox" id="tglBuffers" /> Buffers (km)</label>
            <label class="layer-toggle sub"><input type="checkbox" id="tglFolhas" /> Folhas 1:100k</label>
          </div>
        </div>
      </div>

      <div class="stats" id="stats"></div>
      <ul id="companyList" class="company-list"></ul>

      <footer class="sidebar-footer">
        <p id="metaSource"></p>
        <p class="disclaimer" id="quotesAsOf"></p>
        <p class="disclaimer" id="metaDisclaimer"></p>
      </footer>
    </aside>

    <main id="mapWrap">
      <div id="map"></div>
      <div id="legend" class="legend">
        <button id="legendToggle" class="legend-toggle" aria-label="Mostrar ou ocultar a legenda">
          <span class="chev">▾</span> Legenda
        </button>
        <div id="legendBody" class="legend-body"></div>
      </div>
    </main>
  </div>

  <!-- Modal do relatório (PDF) -->
  <div id="reportModal" class="report-modal">
    <div id="reportBackdrop" class="report-backdrop"></div>
    <div class="report-panel">
      <div class="report-head">
        <div class="report-tabs">
          <button class="report-tab active" data-doc="analise">Análise de potencial</button>
          <button class="report-tab" data-doc="dossie">Dossiê da área</button>
        </div>
        <div class="report-actions">
          <a id="reportOpen" href="#" target="_blank" rel="noopener" class="report-open">Abrir em nova aba ↗</a>
          <button id="reportClose" class="report-close" aria-label="Fechar">✕</button>
        </div>
      </div>
      <iframe id="reportFrame" title="Relatório" src="about:blank"></iframe>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js?v=16"></script>
</body>
</html>
